<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talentio — Premium Global Freelance Marketplace & Talent Platform</title>
    <meta name="description" content="Talentio is the premier international marketplace connecting vetted global freelancers and modern enterprises with secure escrow, transparent milestones, and top-tier digital services." />
    
    <!-- Canonical & Indexing Directives -->
    <link rel="canonical" href="https://talentio.app" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Talentio Inc." />
    <meta name="keywords" content="freelance marketplace, escrow payments, vetted freelancers, hire developers, UI/UX designers, AI engineers, blockchain talent, remote jobs, milestone contracts" />
    
    <!-- Mobile & PWA Configuration -->
    <meta name="application-name" content="Talentio" />
    <meta name="apple-mobile-web-app-title" content="Talentio" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Official Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1A1633" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- OpenGraph / Social / Search Preview Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Talentio" />
    <meta property="og:url" content="https://talentio.app" />
    <meta property="og:title" content="Talentio — Premium Global Freelance Marketplace & Escrow Platform" />
    <meta property="og:description" content="Discover top-tier vetted digital talent with instant escrow protection, milestone-based security, and real-time collaboration." />
    <meta property="og:image" content="https://talentio.app/logo.svg" />
    <meta property="og:image:secure_url" content="https://talentio.app/logo.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:alt" content="Talentio Logo - Vetted Talent & Escrow Protection" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@TalentioApp" />
    <meta name="twitter:creator" content="@TalentioApp" />
    <meta name="twitter:url" content="https://talentio.app" />
    <meta name="twitter:title" content="Talentio — Premium Global Freelance Marketplace" />
    <meta name="twitter:description" content="Connect with the top 3% vetted global talent with bank-grade escrow protection and transparent milestone releases." />
    <meta name="twitter:image" content="https://talentio.app/logo.svg" />
    <meta name="twitter:image:alt" content="Talentio Official Logo" />

    <!-- Schema.org JSON-LD for Google Search Engine Logo, Knowledge Graph & Site Navigation -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://talentio.app/#organization",
            "name": "Talentio",
            "alternateName": ["Talentio Marketplace", "Talentio Escrow"],
            "url": "https://talentio.app",
            "logo": {
              "@type": "ImageObject",
              "url": "https://talentio.app/logo.svg",
              "caption": "Talentio Official Logo"
            },
            "image": "https://talentio.app/logo.svg",
            "description": "Talentio is the premier international marketplace connecting vetted global freelancers and modern enterprises with secure escrow, transparent milestones, and top-tier digital services.",
            "sameAs": [
              "https://twitter.com/TalentioApp",
              "https://linkedin.com/company/talentio-app",
              "https://github.com/talentio"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://talentio.app/#website",
            "url": "https://talentio.app",
            "name": "Talentio",
            "description": "Global Freelance Marketplace with Milestone Escrow Protection",
            "publisher": {
              "@id": "https://talentio.app/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://talentio.app/?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#F2F0FF] text-[#1A1633] antialiased selection:bg-[#6E5BFF] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
