[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Netlify functions redirect for /api/verify-recaptcha
[[redirects]]
  from = "/api/verify-recaptcha"
  to = "/.netlify/functions/verify-recaptcha"
  status = 200
  force = true

# Firebase Auth reverse proxy (handles /__/auth/* without 3rd party cookie blocking)
[[redirects]]
  from = "/__/auth/*"
  to = "https://talentio-92919.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# SPA Fallback for Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker must NOT be aggressively cached so clients detect updates immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "max-age=0, no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Web App Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# Security and PWA Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()"
